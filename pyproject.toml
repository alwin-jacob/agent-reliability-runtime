[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-reliability-runtime"
version = "0.3.0"
description = "Deterministic local supervisor/worker agent runtime with inspectable reliability evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.25.1",
  "langgraph==1.2.11",
  "pydantic==2.12.5",
]

[project.scripts]
agent-runtime = "agent_runtime.cli:main"

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.13.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "strict"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Core Pydantic V1 functionality isn't compatible with Python 3.14 or greater:UserWarning:langchain_core.utils.pydantic",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# jsonschema does not publish inline typing or a version-matched stub package.
[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
